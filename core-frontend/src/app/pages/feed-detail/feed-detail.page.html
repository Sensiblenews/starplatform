<ion-header class="ion-no-border">
  <ion-toolbar class="star-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/" text=""></ion-back-button>
    </ion-buttons>
    <!-- 로고 탭 → 로비 (스타 페이지와 동일). 점점점 → 메뉴 팝오버 (2-33차 버그 수정) -->
    <ion-title mode="md" (click)="goLobby()" style="cursor: pointer;">Star Platform</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="presentMenu($event)">
        <ion-icon slot="icon-only" name="ellipsis-horizontal"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- 삭제됐거나 검수 대기(타인 접근 불가)인 글 — 빈 화면 대신 안내 (2-27차) -->
  <div class="not-found-box" *ngIf="notFound">
    <ion-icon name="alert-circle-outline"></ion-icon>
    <p>This post has been deleted or does not exist.</p>
  </div>

  <div class="media-stack" *ngIf="!notFound">
    <!-- 🖼️ 1순위: 이미지들 -->
    <div class="media-item" *ngFor="let media of getPhotoList(); let i = index">
      <!-- 승인 전에는 주소가 없다. 작성자 본인은 토큰 주소로 보고, 타인은 안내를 본다(2-26차) -->
      <ng-container *ngIf="media.displayUrl; else underReview">
        <!-- 탭하면 전체 화면 뷰어 — 두 손가락으로 확대·축소 (2-35차) -->
        <img [src]="media.displayUrl" (error)="handleImgError($event)" (click)="openPhotoViewer(i)" />
      </ng-container>
      <ng-template #underReview>
        <div class="review-box">
          <ion-icon name="eye-off-outline"></ion-icon>
          <p class="review-title">Under review</p>
          <p class="review-desc">This photo is visible only to its author until approved.</p>
        </div>
      </ng-template>
    </div>

    <!-- 🎥 2순위: 동영상들 -->
    <div class="media-item-video" *ngFor="let media of getVideoList()">
      <div class="video-wrapper" *ngIf="media.displayUrl; else videoUnderReview">
        <!-- 2-35차: 소리 아이콘 없이 처음부터 소리와 함께 재생 (재생은 observeVideos → MediaAudioService) -->
        <video #detailVideo
            loop playsinline preload="metadata"
            [poster]="media.posterUrl"
            class="feed-video">
            <source [src]="media.displayUrl" type="video/mp4">
        </video>
      </div>
      <!-- 검수 대기 영상(2-32차). 작성자 본인은 사진과 똑같이 썸네일만(표시 없음), 타인은 안내 — 재생은 승인 후 -->
      <ng-template #videoUnderReview>
        <div class="video-review">
          <img *ngIf="media.posterUrl; else videoReviewNotice" [src]="media.posterUrl" (error)="handleImgError($event)" />
          <ng-template #videoReviewNotice>
            <div class="review-box">
              <ion-icon name="eye-off-outline"></ion-icon>
              <p class="review-title">Under review</p>
              <p class="review-desc">This video is visible only to its author until approved.</p>
            </div>
          </ng-template>
        </div>
      </ng-template>
    </div>

    <!-- 🎬 3순위: YouTube 임베드 -->
    <div class="media-item-youtube" *ngIf="safeYoutubeUrl">
      <div class="youtube-wrapper">
        <iframe 
          [src]="safeYoutubeUrl" 
          frameborder="0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
          allowfullscreen>
        </iframe>
      </div>
    </div>
  </div>

  <!-- 응답 전에는 작성자 행을 그리지 않는다 — 'Unknown' 이름이 잠깐 보이던 버그 (2-33차) -->
  <div class="feed-body-section" *ngIf="!notFound && isLoaded">
    <div class="author-row">
      <ion-avatar>
        <img [src]="starProfileImg" (error)="handleImgError($event)" />
      </ion-avatar>
      <div class="author-info">
        <span class="name">{{ starName }}</span>
        <span class="date">{{ contentInfo?.CREATED_DATE | date:'yyyy.MM.dd HH:mm' }}</span>
      </div>
    </div>

    <!-- 본문 주소는 파란 링크로 그리고, 누르면 앱 안/인앱 브라우저로 연다 (2-35차) -->
    <div class="content-text" [innerHTML]="safeContentHtml" (click)="onBodyClick($event)"></div>
  </div>
</ion-content>
