<ion-header class="ion-no-border">
  <ion-toolbar class="star-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/" text=""></ion-back-button>
    </ion-buttons>
    <ion-title mode="md">Star Platform</ion-title>
    <ion-buttons slot="end">
      <ion-icon slot="icon-only" name="ellipsis-horizontal"></ion-icon>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- 삭제됐거나 검수 대기(타인 접근 불가)인 글 — 빈 화면 대신 안내 (2-27차) -->
  <div class="not-found-box" *ngIf="notFound">
    <ion-icon name="alert-circle-outline"></ion-icon>
    <p>This post has been deleted or does not exist.</p>
  </div>

  <div class="media-stack" *ngIf="!notFound">
    <!-- 🖼️ 1순위: 이미지들 -->
    <div class="media-item" *ngFor="let media of getPhotoList()">
      <!-- 승인 전에는 주소가 없다. 작성자 본인은 토큰 주소로 보고, 타인은 안내를 본다(2-26차) -->
      <ng-container *ngIf="media.displayUrl; else underReview">
        <img [src]="media.displayUrl" (error)="handleImgError($event)" />
      </ng-container>
      <ng-template #underReview>
        <div class="review-box">
          <ion-icon name="eye-off-outline"></ion-icon>
          <p class="review-title">Under review</p>
          <p class="review-desc">This photo is visible only to its author until approved.</p>
        </div>
      </ng-template>
    </div>

    <!-- 🎥 2순위: 동영상들 -->
    <div class="media-item-video" *ngFor="let media of getVideoList()">
      <div class="video-wrapper">
        <video 
            [muted]="media.isMuted" 
            autoplay loop playsinline 
            [poster]="media.THUMB_URL"
            class="feed-video">
            <source [src]="media.MEDIA_URL" type="video/mp4">
        </video>

        <div class="sound-btn" (click)="toggleSound(media, $event)">
            <ion-icon [name]="media.isMuted ? 'volume-mute' : 'volume-high'"></ion-icon>
        </div>
      </div>
    </div>

    <!-- 🎬 3순위: YouTube 임베드 -->
    <div class="media-item-youtube" *ngIf="safeYoutubeUrl">
      <div class="youtube-wrapper">
        <iframe 
          [src]="safeYoutubeUrl" 
          frameborder="0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
          allowfullscreen>
        </iframe>
      </div>
    </div>
  </div>

  <div class="feed-body-section" *ngIf="!notFound">
    <div class="author-row">
      <ion-avatar>
        <img [src]="starProfileImg" (error)="handleImgError($event)" />
      </ion-avatar>
      <div class="author-info">
        <span class="name">{{ starName }}</span>
        <span class="date">{{ contentInfo?.CREATED_DATE | date:'yyyy.MM.dd HH:mm' }}</span>
      </div>
    </div>

    <div class="content-text" [innerHTML]="safeContentHtml"></div>
  </div>
</ion-content>
