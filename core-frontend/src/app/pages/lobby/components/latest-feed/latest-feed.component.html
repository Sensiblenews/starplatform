<!-- 세로형 Latest Content: 카드 세로 목록 + 콘텐츠 3·6·7번째 뒤 네이티브 광고 자리 (2-34차) -->
<ng-container *ngFor="let row of rows; trackBy: trackByRow">

  <!-- 네이티브 광고 자리 — 로비의 다른 슬롯과 같은 규칙: 광고 로드 성공(ad_loaded) 때만 펼쳐 no-fill 시 공백이 남지 않는다 -->
  <div *ngIf="row.kind === 'ad'" class="lobby-ad-slot" [attr.data-slot]="row.slot"
    [class.filled]="adFilled[row.slot]" [style.height.px]="adFilled[row.slot] ? adHeight[row.slot] : null"></div>

  <div *ngIf="row.kind === 'item'" #card class="lf-card" (click)="onCardTap(row.item)">
    <div class="lf-media">
      <ng-container *ngIf="isVideo(row.item); else photo">
        <!-- 재생은 VisibleVideoPlayer 가 화면에 가장 많이 보이는 카드 하나만 켠다 -->
        <video muted playsinline loop preload="metadata"
          [attr.src]="row.item.mediaUrl" [attr.poster]="row.item.thumbUrl || null"
          (playing)="onPlaying(row.item)"></video>
        <img class="lf-poster" *ngIf="row.item.thumbUrl" [class.is-hidden]="playingIndex === row.index"
          [src]="row.item.thumbUrl" alt="" loading="lazy" />
        <span class="lf-video-badge"><ion-icon name="play"></ion-icon></span>
      </ng-container>
      <ng-template #photo>
        <img class="lf-photo" [src]="row.item.mediaUrl || row.item.thumbUrl || ''" alt="" loading="lazy" />
      </ng-template>

      <span class="lf-featured" *ngIf="row.item.isFeatured === 'Y'">Featured</span>

      <!-- 게시자 오버레이 — Star Shorts 와 같은 크기 -->
      <div class="lf-author" (click)="onProfileTap(row.item, $event)">
        <img class="lf-avatar" [src]="row.item.starImage || defaultAvatar" (error)="handleImageError($event)" alt="" />
        <div class="lf-author-text">
          <div class="lf-name">{{ row.item.starName }}</div>
          <div class="lf-sub">StarPage <ion-icon name="chevron-forward"></ion-icon></div>
        </div>
      </div>
    </div>
    <div class="lf-title" *ngIf="row.item.title">{{ row.item.title }}</div>
  </div>

</ng-container>
