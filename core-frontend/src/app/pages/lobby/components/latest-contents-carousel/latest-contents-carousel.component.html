<div class="latest-card" *ngIf="active as item">
  <!-- 본문: 화면 폭 전체를 쓰는 메인 영상 + 오른쪽 위에 겹친 다음 숏폼 미리보기. 가로 스와이프로 이전·다음.
       2-34 3차 피드백: 카드 테두리(어두운 여백)·위 제목 줄을 없애고 영상만 꽉 채운다. 제목은 영상 왼쪽 위에 얹는다 -->
  <div class="latest-main" (click)="onVideoTap()" (touchstart)="onTouchStart($event)" (touchend)="onTouchEnd($event)">
    <div class="latest-main-inner">
      <!-- 2-35차: 숏폼에도 사진 글을 편성할 수 있다. 영상 글만 <video> 로 그리고 사진 글은 이미지로 -->
      <ng-container *ngIf="isVideo(item); else photo">
        <!-- 한 번에 영상 하나만 그린다. src 가 바뀌면 브라우저가 새로 불러온다 -->
        <!-- poster 도 함께 준다: Android WebView 는 poster 가 없으면 첫 프레임 전까지 회색 바탕 + 검은 재생 버튼을 그린다 -->
        <video class="no-native-controls" #video muted playsinline loop preload="auto" webkit-playsinline disablepictureinpicture disableremoteplayback x-webkit-airplay="deny"
          [attr.src]="item.mediaUrl" [attr.poster]="item.thumbUrl || null"
          (playing)="onPlaying()" (pause)="onPaused()" (error)="onVideoError()"></video>
        <!-- 재생이 시작되기 전까지 썸네일로 덮는다. 가로 영상·포스터도 같은 비율로 잘린다 -->
        <img class="latest-poster" [class.is-hidden]="isPlaying" [src]="item.thumbUrl || ''" alt="" *ngIf="item.thumbUrl" />
        <div class="play-overlay" *ngIf="showPlayButton" (click)="onPlayButton($event)">
          <ion-icon name="play"></ion-icon>
        </div>
      </ng-container>
      <ng-template #photo>
        <img class="latest-poster" [src]="item.mediaUrl || item.thumbUrl || ''" alt="" />
      </ng-template>
      <span class="latest-title">Star Shorts</span>
      <span class="featured-badge" *ngIf="item.isFeatured === 'Y'">Featured</span>

      <!-- 오른쪽 중간~아래 액션 열 (2-34 후속 — 전체 화면 플레이어와 같은 조회수·좋아요·댓글·저장·공유).
           맨 아래가 왼쪽 프로필 이름 줄까지 내려온다. 소리 아이콘은 클라이언트 요청으로 없앴다(앱을 켜면 바로 소리) -->
      <app-content-actions class="latest-actions" [conId]="item.conId" size="card"
        (busyChange)="onActionsBusy($event)"></app-content-actions>

      <!-- 다음 숏폼: 정지 썸네일만 (영상 두 개가 동시에 돌지 않게). 누르면 메인으로 전환 -->
      <div class="latest-next" *ngIf="next as nextItem" (click)="onNextTap($event)">
        <img [src]="nextItem.thumbUrl || ''" alt="" />
      </div>

      <!-- 게시자: 아바타 + 이름. 영상 위 왼쪽 아래 오버레이, 영상 클릭과 분리 (2-34 3차: StarPage 문구 제거) -->
      <div class="latest-author" (click)="onProfileTap($event)">
        <img class="latest-avatar" [src]="item.starImage || defaultAvatar" (error)="handleImageError($event)" alt="" />
        <div class="latest-author-text">
          <div class="latest-name">{{ item.starName }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
