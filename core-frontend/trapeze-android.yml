vars:
  PACKAGE_NAME:
    default: kr.co.sensiblenews.witchHuntingVU2D7F2P7E
  KAKAO_NATIVE_KEY:
    default: 2df520525f6a0b6f05464dbc7f96ee1a
  FACEBOOK_APP_ID:
    default: 1283614445756373
  FACEBOOK_NATIVE_TOKEN:
    default: 0a692baf0a2433574b1aa4ff158084b3
  ADMOB_APP_ID:
    default: ca-app-pub-9109251900558498~1873722550
  DEEPLINK_HOST:
    default: witch-hunting.com

platforms:
  android:
    packageName: $PACKAGE_NAME
    # ⚠️ 릴리스 버전의 유일한 소스 오브 트루스다. 여기 적힌 값이 최종적으로 이긴다.
    #
    # trapeze는 android/app/build.gradle의 현재 값을 "무시하고" 아래 선언값을 쓴다.
    # 그래서 클린 빌드(npm run build-android → set-projects-android)를 돌리면
    # build.gradle에 뭐가 적혀 있든 여기 값으로 덮어써진다.
    # 2026-09-13 이전에는 이 값이 84435로 방치돼 있어, 클린 빌드를 돌리는 순간
    # 운영(100067)보다 한참 낮은 84436이 나오는 상태였다. 그동안은 trapeze를 거치지 않는
    # 경로(Android Studio 직접 빌드 등)로 릴리스해 문제가 드러나지 않았다.
    #
    # incrementVersionCode 키는 일부러 뺐다. 실측 결과:
    #   true  → 선언값 +1 (누적 아님. 몇 번을 돌려도 같은 값)
    #   false → 무시된다. 여전히 선언값 +1 이 나간다
    #   줄 없음 → 선언값이 그대로 나간다  ← 우리가 쓰는 방식
    # false로 끌 수 있다고 생각하면 번호가 1씩 어긋난다. 되살리지 말 것.
    #
    # 릴리스할 때마다 아래 두 줄을 올리고 커밋할 것. Play Console의 최고 versionCode보다
    # 반드시 커야 한다.
    versionName: 10.0.69
    versionCode: 100069

    manifest:
      # SNS LOGIN MANIFEST

      - file: AndroidManifest.xml
        target: manifest/application
        attrs:
          android:usesCleartextTraffic: true
          android:name: .GlobalApplication

      - file: AndroidManifest.xml
        target: manifest
        merge: <queries>
          <package android:name="com.kakao.talk" />
          <intent>
          <action android:name="android.intent.action.SENDTO"/>
          <data android:scheme="mailto"/>
          </intent>
          </queries>

      - file: AndroidManifest.xml
        target: manifest/application/activity
        inject: |
          <intent-filter>
          <action android:name="android.intent.action.VIEW" />
          <category android:name="android.intent.category.DEFAULT" />
          <category android:name="android.intent.category.BROWSABLE" />
          <data
          android:host="@string/kakaolink_host"
          android:scheme="@string/kakao_scheme" />
          </intent-filter>
          <!-- App Links는 공유 링크 경로만 가로챈다. 약관/개인정보/웹 랜딩은 브라우저에 남긴다 -->
          <intent-filter android:autoVerify="true">
              <action android:name="android.intent.action.VIEW" />
              <category android:name="android.intent.category.DEFAULT" />
              <category android:name="android.intent.category.BROWSABLE" />
              <data android:scheme="https" android:host="$DEEPLINK_HOST" android:pathPrefix="/post/" />
              <data android:scheme="https" android:host="$DEEPLINK_HOST" android:pathPrefix="/star/" />
              <data android:scheme="https" android:host="$DEEPLINK_HOST" android:pathPrefix="/feed-detail/" />
              <data android:scheme="https" android:host="$DEEPLINK_HOST" android:pathPrefix="/witch/post/" />
              <data android:scheme="https" android:host="$DEEPLINK_HOST" android:pathPrefix="/witch/star/" />
              <data android:scheme="https" android:host="$DEEPLINK_HOST" android:pathPrefix="/witch/feed-detail/" />
          </intent-filter>

      - file: AndroidManifest.xml
        target: manifest/application
        inject: |
          <activity 
              android:name="com.kakao.sdk.auth.AuthCodeHandlerActivity"
              android:exported="true">
              <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:host="oauth"
                          android:scheme="@string/kakao_scheme" />
              </intent-filter>
          </activity>

      - file: AndroidManifest.xml
        target: manifest/application
        merge: <meta-data android:name="com.kakao.sdk.AppKey" android:value="@string/kakao_app_key" />

      - file: AndroidManifest.xml
        target: manifest/application
        merge:
          <meta-data android:name="com.facebook.sdk.ApplicationId" android:value="@string/facebook_app_id"/>
          <meta-data android:name="com.facebook.sdk.ClientToken" android:value="@string/facebook_client_token"/>

      # Camera
      - file: AndroidManifest.xml
        target: manifest
        inject: |
          <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
          <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
          <uses-permission android:name="android.permission.CAMERA" />

      # ADMOB
      - file: AndroidManifest.xml
        target: manifest/application
        merge: <meta-data
          android:name="com.google.android.gms.ads.APPLICATION_ID"
          android:value="@string/admob_app_id"/>

      # BILLING
      - file: AndroidManifest.xml
        target: manifest
        inject: |
          <uses-permission android:name="com.android.vending.BILLING" />

      # PUSH
      - file: AndroidManifest.xml
        target: manifest
        inject: |
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

    res:
      - path: values
        file: sdk_values.xml
        text: |
          <?xml version='1.0' encoding='utf-8'?>
            <resources>
              <string name="kakao_app_key">$KAKAO_NATIVE_KEY</string>
              <string name="kakao_scheme">kakao$KAKAO_NATIVE_KEY</string>
              <string name="kakaolink_host">kakaolink</string>
              <string name="facebook_app_id">$FACEBOOK_APP_ID</string>
              <string name="facebook_client_token">$FACEBOOK_NATIVE_TOKEN</string>
              <string name="admob_app_id">$ADMOB_APP_ID</string>
            </resources>
