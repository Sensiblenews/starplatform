vars:
  BUNDLE_ID:
    default: kr.co.sensiblenews.witchHunting
  KAKAO_NATIVE_KEY:
    default: 2df520525f6a0b6f05464dbc7f96ee1a
  FACEBOOK_APP_ID:
    default: 1283614445756373
  FACEBOOK_NATIVE_TOKEN:
    default: 0a692baf0a2433574b1aa4ff158084b3
  ADMOB_APP_ID:
    default: ca-app-pub-9109251900558498~5969091176

platforms:
  ios:
    targets:
      App:
        bundleId: $BUNDLE_ID
        # ⚠️ iOS 릴리스 버전의 유일한 소스 오브 트루스다 (Android는 trapeze-android.yml).
        #
        # trapeze는 ios/App/App.xcodeproj/project.pbxproj의 현재 값을 무시하고 아래 선언값을
        # MARKETING_VERSION / CURRENT_PROJECT_VERSION 에 써넣는다.
        # 2026-09-13 이전에는 8.0.5 / 6 으로 방치돼 있어, trapeze를 한 번만 돌려도
        # 실제 출시본(10.0.49 / 100049)보다 한참 낮은 값이 프로젝트에 박혔다.
        #
        # incrementBuildNumber 키는 일부러 뺐다. Android의 incrementVersionCode와 같은 함정으로,
        # true면 선언값 +1이 나가고 false로 꺼지지도 않는다. 키가 없어야 선언값이 그대로 나간다.
        #
        # 릴리스할 때마다 아래 두 줄을 올리고 커밋할 것.
        # App Store Connect에 올라간 최고 빌드 번호보다 반드시 커야 한다.
        version: 10.0.69
        buildNumber: 100069
        productName: earthLotto
        displayName: 스타플랫폼

        entitlements:
          - com.apple.developer.associated-domains:
              ['applinks:witch-hunting.com']
          - com.apple.developer.applesignin: ['Default']

        plist:
          # - replace: true
          #   entries:

          - replace: false
            entries:
              - CFBundleDevelopmentRegion: ko_KR
              - CFBundleURLTypes:
                  - CFBundleURLSchemes:
                      - kakao$KAKAO_NATIVE_KEY
                      - fb$FACEBOOK_APP_ID
                      # 웹 랜딩 "Open in App" 버튼이 사용하는 딥링크 커스텀 스킴
                      - witchhunting

              - KAKAO_APP_KEY: $KAKAO_NATIVE_KEY
              - FacebookAppID: $FACEBOOK_APP_ID
              - FacebookClientToken: $FACEBOOK_NATIVE_TOKEN
              - FacebookDisplayName: 스타플랫폼

              - NSCameraUsageDescription: 게시글 등록을 위해 카메라권한을 허용합니다.
              - NSPhotoLibraryAddUsageDescription: 게시글 등록을 위해 앨범 접근권한을 허용합니다.
              - NSPhotoLibraryUsageDescription: 게시글 등록을 위해 앨범 접근권한을 허용합니다.
              - NSUserTrackingUsageDescription: 사용자 맞춤 광고를 위해 추적을 허용합니다.

              - GADIsAdManagerApp: true
              - GADApplicationIdentifier: $ADMOB_APP_ID

              - SKAdNetworkItems:
                  - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork

              # NSAppTransportSecurity는 딕셔너리다. 항목 앞에 대시를 붙이면 배열로 생성돼
              # GTMSessionFetcher가 objectForKey:를 보낼 때 unrecognized selector로 죽는다.
              - NSAppTransportSecurity:
                  NSAllowsArbitraryLoads: true

              - LSApplicationQueriesSchemes:
                  - mailto
                  - googlegmail
                  - ms-outlook
                  - kakao$KAKAO_NATIVE_KEY
                  - kakaokompassauth
                  - storykompassauth
                  - kakaolink
                  - storylink
                  - kakaotalk
                  - kakaotalk-5.9.7
                  - kakaostory-2.9.0
                  - fbapi
                  - fbapi20130214
                  - fbapi20130410
                  - fbapi20130702
                  - fbapi20131010
                  - fbapi20131219
                  - fbapi20140410
                  - fbapi20140116
                  - fbapi20150313
                  - fbapi20150629
                  - fbapi20160328
                  - fbauth
                  - fb-messenger-share-api
                  - fbauth2
                  - fbshareextension
